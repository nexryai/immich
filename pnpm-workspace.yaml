packages:
  - packages/**
  - docs
  - e2e
  - i18n
  - server
  - plugins
  - web
  - .github
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: true
  canvas: false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  utimes: false
  '@tailwindcss/oxide': true
  core-js-pure: false
  postman-code-generators: false
  unrs-resolver: false
overrides:
  canvas: 3.2.3
  sharp: ^0.35.3
  # 1.9.3-1.9.5 are confirmed broken
  tsc-alias: 1.9.7
packageExtensions:
  # tscompat imports the JS compiler API without declaring TypeScript itself.
  # Keep it on the same TS6 API as typescript-eslint, not the hoisted TS7 CLI.
  '@koddsson/eslint-plugin-tscompat@0.2.0':
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  # Svelte's parser also resolves the compiler from ESLint's package location.
  'eslint@10':
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  'svelte-eslint-parser@1':
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  nestjs-kysely:
    dependencies:
      tslib: '*'
  nestjs-otel:
    dependencies:
      tslib: '*'
  '@photo-sphere-viewer/equirectangular-video-adapter':
    dependencies:
      three: '*'
  '@photo-sphere-viewer/video-plugin':
    dependencies:
      three: '*'
  sharp:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@immich/ui':
    dependencies:
      tailwindcss: '>=4.1'
  tailwind-variants:
    dependencies:
      tailwindcss: '>=4.1'
  bcrypt:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@nestjs/swagger':
    peerDependencies:
      typescript: '*'
dedupePeerDependents: false
preferWorkspacePackages: true
injectWorkspacePackages: true
shamefullyHoist: false
verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  - '@immich/ui'
  - '@immich/sql-tools@0.6.3 || 0.6.6'
  - '@nestjs/cli@12.0.1'
